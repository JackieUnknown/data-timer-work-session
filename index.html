<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Work Session Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;color:#111827}
main{max-width:720px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px}
.label{font-size:13px;color:#6b7280}.title{font-weight:700;font-size:18px;margin-top:3px}
.time{font-variant-numeric:tabular-nums;letter-spacing:-.05em;font-size:clamp(42px,10vw,64px);font-weight:700;margin-top:18px}
.total{font-size:clamp(36px,8vw,52px)}.status{font-size:13px;color:#6b7280}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
button{min-height:48px;border-radius:12px;padding:0 17px;border:1px solid #d1d5db;background:white;font-weight:650;font-size:15px;cursor:pointer}
button.primary{background:#111827;color:white;border-color:#111827}
button:disabled{opacity:.4;cursor:not-allowed}
h2{font-size:17px;margin:24px 0 8px}.hint{font-size:12px;color:#6b7280;margin-bottom:10px}
.task{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:7px 0;background:white}
.task.selected{outline:2px solid #111827;outline-offset:1px}
.empty{color:#6b7280;font-size:14px;padding:12px 0}
.complete{margin-top:18px}.danger{border-color:#d1d5db}
@media(max-width:560px){main{padding:14px}.grid{grid-template-columns:1fr}.actions button{flex:1 1 140px}}
</style>
</head>
<body>
<main>
  <div class="grid">
    <section class="card">
      <div class="label">Current task</div>
      <div id="taskLabel" class="title">Ready to start</div>
      <div id="taskTime" class="time">00:00:00</div>
      <div id="status" class="status">Idle</div>
    </section>
    <section class="card">
      <div class="label">Total worked</div>
      <div id="totalTime" class="time total">00:00:00</div>
      <div id="sessionState" class="status">No session started</div>
    </section>
  </div>

  <div class="actions">
    <button id="start" class="primary">Start</button>
    <button id="pause" disabled>Pause</button>
    <button id="stop" disabled>Stop → Next Task</button>
    <button id="end" disabled>End Session</button>
    <button id="reset">Reset</button>
  </div>

  <h2>Completed tasks <span id="count" class="status"></span></h2>
  <div class="hint">Tap a task to select it, then delete it to subtract its time from the total.</div>
  <div id="tasks"></div>
  <button id="delete" class="danger" disabled>Delete selected task</button>
  <div id="selection" class="hint">No task selected.</div>

  <section id="complete" class="card complete" hidden>
    <div class="title">Session complete</div>
    <div class="label">Total actual working time</div>
    <div id="final" class="time total">00:00:00</div>
  </section>
</main>

<script>
(() => {
  const KEY = "work-session-timer-v1";
  const $ = id => document.getElementById(id);

  let state = load() || {
    tasks: [], totalMs: 0, running: false, paused: false,
    taskNo: 0, taskStartedAt: null, pausedAt: null, finished: false,
    selected: null
  };

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)); }
    catch(e){ return null; }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

  function fmt(ms){
    ms=Math.max(0,Math.floor(ms||0));
    const s=Math.floor(ms/1000), h=Math.floor(s/3600);
    const m=Math.floor((s%3600)/60), sec=s%60;
    return [h,m,sec].map(v=>String(v).padStart(2,"0")).join(":");
  }

  function elapsed(){
    if(!state.running || !state.taskStartedAt) return 0;
    if(state.paused) return state.pausedAt - state.taskStartedAt;
    return Date.now() - state.taskStartedAt;
  }

  function render(){
    const e=elapsed();
    $("taskTime").textContent=state.running ? fmt(e) : "00:00:00";
    $("totalTime").textContent=fmt(state.totalMs + (state.running ? e : 0));

    if(state.running){
      $("taskLabel").textContent="Task "+state.taskNo;
      $("status").textContent=state.paused ? "Paused" : "Tracking";
      $("sessionState").textContent=state.paused ? "Session paused" : "Session running";
    } else if(state.finished){
      $("taskLabel").textContent="Session finished";
      $("status").textContent="Done";
      $("sessionState").textContent=state.tasks.length+" tasks completed";
    }

    $("start").disabled=state.running || state.finished;
    $("pause").disabled=!state.running || state.finished;
    $("stop").disabled=!state.running || state.finished;
    $("end").disabled=!state.running || state.finished;
    $("pause").textContent=state.paused ? "Resume" : "Pause";

    $("count").textContent=" ("+state.tasks.length+")";
    $("complete").hidden=!state.finished;
    if(state.finished) $("final").textContent=fmt(state.totalMs);

    const box=$("tasks"); box.innerHTML="";
    state.tasks.forEach((t,i)=>{
      const b=document.createElement("button");
      b.className="task"+(state.selected===i?" selected":"");
      b.innerHTML="<span>Task "+(i+1)+"</span><strong>"+fmt(t.ms)+"</strong>";
      b.onclick=()=>{
        state.selected=state.selected===i ? null : i;
        save(); render();
      };
      box.appendChild(b);
    });
    if(!state.tasks.length) box.innerHTML='<div class="empty">No completed tasks yet.</div>';

    $("delete").disabled=state.selected===null || !state.tasks[state.selected];
    $("selection").textContent=state.selected===null
      ? "No task selected."
      : "Selected Task "+(state.selected+1)+" — "+fmt(state.tasks[state.selected].ms)+" will be removed from the total.";
  }

  function start(){
    if(state.running || state.finished) return;
    state.running=true; state.paused=false;
    state.taskNo=state.tasks.length+1;
    state.taskStartedAt=Date.now();
    state.pausedAt=null;
    save(); tick();
  }

  function togglePause(){
    if(!state.running || state.finished) return;
    if(!state.paused){
      state.pausedAt=Date.now();
      state.paused=true;
    } else {
      const pauseDuration=Date.now()-state.pausedAt;
      state.taskStartedAt+=pauseDuration;
      state.paused=false; state.pausedAt=null;
    }
    save(); render(); if(!state.paused) tick();
  }

  function stopNext(){
    if(!state.running) return;
    const e=elapsed();
    state.tasks.push({ms:e});
    state.totalMs+=e;
    state.taskNo=state.tasks.length+1;
    state.taskStartedAt=Date.now();
    state.paused=false; state.pausedAt=null; state.selected=null;
    save(); render(); tick();
  }

  function endSession(){
    if(!state.running) return;
    const e=elapsed();
    state.tasks.push({ms:e});
    state.totalMs+=e;
    state.running=false; state.paused=false; state.finished=true;
    state.taskStartedAt=null; state.pausedAt=null; state.selected=null;
    save(); render();
  }

  function deleteSelected(){
    const i=state.selected;
    if(i===null || !state.tasks[i]) return;
    state.totalMs=Math.max(0,state.totalMs-state.tasks[i].ms);
    state.tasks.splice(i,1);
    state.selected=null;
    save(); render();
  }

  function reset(){
    if(!confirm("Reset the entire session and delete all recorded task times?")) return;
    state={tasks:[],totalMs:0,running:false,paused:false,taskNo:0,
      taskStartedAt:null,pausedAt:null,finished:false,selected:null};
    save(); render();
  }

  function tick(){
    render();
    if(state.running && !state.paused) setTimeout(tick,250);
  }

  $("start").onclick=start;
  $("pause").onclick=togglePause;
  $("stop").onclick=stopNext;
  $("end").onclick=endSession;
  $("delete").onclick=deleteSelected;
  $("reset").onclick=reset;

  window.addEventListener("visibilitychange",()=>{ save(); render(); });
  window.addEventListener("pagehide",save);

  render();
  if(state.running && !state.paused) tick();
})();
</script>
</body>
</html>
